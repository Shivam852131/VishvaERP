<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Messages | VishvaERP</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/custom.css">
  <style>
    /* ═══════════════════════════════════════════════════
       VISHVA MESSAGES / CHAT - RESPONSIVE DESIGN SYSTEM
       ═══════════════════════════════════════════════════ */
    :root {
      --msg-primary: #4F46E5;
      --msg-primary-hover: #4338CA;
      --msg-primary-light: #EEF2FF;
      --msg-bg: #F8FAFC;
      --msg-card-bg: #FFFFFF;
      --msg-card-border: #E2E8F0;
      --msg-text-main: #0F172A;
      --msg-text-muted: #64748B;
      --msg-sidebar-w: 340px;
    }

    body.dark-mode {
      --msg-bg: #0B0F19;
      --msg-card-bg: #131B2E;
      --msg-card-border: rgba(255,255,255,0.08);
      --msg-text-main: #F8FAFC;
      --msg-text-muted: #94A3B8;
      --msg-primary-light: rgba(79,70,229,0.18);
    }

    /* Layout Root */
    .chat-layout {
      display: grid;
      grid-template-columns: var(--msg-sidebar-w) minmax(0, 1fr);
      height: calc(100vh - var(--topbar-h, 64px));
      height: calc(100dvh - var(--topbar-h, 64px));
      overflow: hidden;
      background: var(--msg-bg);
      position: relative;
    }

    /* Contacts Sidebar (Master) */
    .chat-sidebar {
      border-right: 1px solid var(--msg-card-border);
      background: var(--msg-card-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 5;
    }

    .contact-search-wrap {
      padding: 14px 16px;
      border-bottom: 1px solid var(--msg-card-border);
      background: var(--msg-card-bg);
      flex-shrink: 0;
    }

    .contact-search-bar {
      position: relative;
      display: flex;
      align-items: center;
    }
    .contact-search-bar i {
      position: absolute;
      left: 12px;
      color: var(--msg-text-muted);
      font-size: 13px;
      pointer-events: none;
    }
    .contact-search-bar input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1.5px solid var(--msg-card-border);
      border-radius: 12px;
      font-size: 13.5px;
      background: var(--msg-bg);
      color: var(--msg-text-main);
      outline: none;
      transition: all 0.2s;
    }
    .contact-search-bar input:focus {
      border-color: var(--msg-primary);
      background: var(--msg-card-bg);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }

    .contacts-scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Contact Item */
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.18s ease;
      border-bottom: 1px solid var(--msg-card-border);
      position: relative;
      background: var(--msg-card-bg);
    }
    .contact-item:hover {
      background: rgba(79,70,229,0.04);
    }
    body.dark-mode .contact-item:hover {
      background: rgba(255,255,255,0.03);
    }
    .contact-item.active {
      background: var(--msg-primary-light);
    }
    .contact-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3.5px;
      background: var(--msg-primary);
      border-radius: 0 4px 4px 0;
    }
    .contact-avatar {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .contact-online-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 11px;
      height: 11px;
      background: #10B981;
      border: 2px solid var(--msg-card-bg);
      border-radius: 50%;
    }
    .contact-name {
      font-weight: 800;
      font-size: 13.5px;
      color: var(--msg-text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .contact-preview {
      font-size: 12px;
      color: var(--msg-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .contact-unread-badge {
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }

    /* Chat Thread (Detail) */
    .chat-thread {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      overflow: hidden;
      background: radial-gradient(circle at top right, rgba(79,70,229,0.04), transparent 40%), var(--msg-bg);
      position: relative;
    }

    /* Thread Header */
    .chat-thread-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--msg-card-border);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    body.dark-mode .chat-thread-header {
      background: rgba(19,27,46,0.88);
      border-bottom-color: rgba(255,255,255,0.06);
    }
    .chat-thread-header-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    /* Mobile Back Button */
    .chat-back-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--msg-card-border);
      background: var(--msg-card-bg);
      color: var(--msg-text-main);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .chat-back-btn:hover {
      background: var(--msg-primary-light);
      border-color: var(--msg-primary);
      color: var(--msg-primary);
    }

    .thread-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(79,70,229,0.22);
    }

    /* Messages Scroll View */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: min(80%, 540px);
      animation: fadeInUp 0.2s ease both;
    }
    .msg-wrapper.sent {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-wrapper.received {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-bubble {
      padding: 11px 16px;
      font-size: 13.5px;
      line-height: 1.55;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .msg-bubble.sent {
      background: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
      color: white;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 4px 14px rgba(79,70,229,0.22);
    }
    .msg-bubble.received {
      background: var(--msg-card-bg);
      color: var(--msg-text-main);
      border: 1px solid var(--msg-card-border);
      border-radius: 18px 18px 18px 4px;
      box-shadow: 0 4px 14px rgba(15,23,42,0.04);
    }

    .msg-time {
      font-size: 10.5px;
      color: #94A3B8;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .msg-bubble.sent .msg-time {
      color: rgba(255,255,255,0.75);
      justify-content: flex-end;
    }
    .msg-check-icon {
      font-size: 10px;
      color: rgba(255,255,255,0.9);
    }

    /* Empty Thread State */
    .chat-empty-thread {
      margin: auto auto;
      text-align: center;
      padding: 30px 16px;
      max-width: 420px;
    }
    .chat-empty-icon {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 10px 26px rgba(79,70,229,0.25);
    }
    .chat-empty-title {
      font-weight: 800;
      font-size: 17px;
      color: var(--msg-text-main);
      margin-bottom: 6px;
    }
    .chat-empty-desc {
      font-size: 13px;
      color: var(--msg-text-muted);
      line-height: 1.5;
    }

    /* Input Bar */
    .chat-input-area {
      padding: 12px 20px 16px;
      border-top: 1px solid var(--msg-card-border);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    body.dark-mode .chat-input-area {
      background: rgba(19,27,46,0.92);
      border-top-color: rgba(255,255,255,0.06);
    }

    .chat-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--msg-bg);
      border: 1.5px solid var(--msg-card-border);
      border-radius: 999px;
      padding: 6px 14px;
      transition: all 0.2s;
    }
    .chat-input-wrapper:focus-within {
      border-color: var(--msg-primary);
      background: var(--msg-card-bg);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }
    .chat-input-wrapper input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13.5px;
      color: var(--msg-text-main);
      font-family: inherit;
    }
    .chat-input-wrapper input::placeholder {
      color: var(--msg-text-muted);
    }

    .chat-action-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      color: var(--msg-text-muted);
      background: transparent;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .chat-action-btn:hover {
      color: var(--msg-primary);
      background: var(--msg-primary-light);
    }

    .chat-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(79,70,229,0.25);
    }
    .chat-send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79,70,229,0.35);
    }

    /* ═══════════════════════════════════════════════════
       MOBILE RESPONSIVE BREAKPOINTS (< 768px)
       ═══════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .chat-layout {
        display: flex;
        flex-direction: column;
        width: 100vw;
        max-width: 100vw;
        height: calc(100vh - var(--topbar-h, 52px));
        height: calc(100dvh - var(--topbar-h, 52px));
        overflow-x: hidden;
      }

      /* State 1: Default on mobile -> show contacts list full width */
      .chat-sidebar {
        width: 100%;
        min-width: 100%;
        flex: 1;
        display: flex;
        border-right: none;
        padding-bottom: calc(var(--bottom-nav-h, 54px) + env(safe-area-inset-bottom, 0px));
      }
      .chat-thread {
        display: none;
        width: 100%;
        min-width: 100%;
        flex: 1;
      }

      /* State 2: Active Conversation -> show chat thread full width */
      .chat-layout.thread-active .chat-sidebar {
        display: none !important;
      }
      .chat-layout.thread-active .chat-thread {
        display: flex !important;
      }

      .chat-back-btn {
        display: inline-flex;
      }

      .chat-thread-header {
        padding: 10px 14px;
      }

      .chat-messages {
        padding: 14px;
      }

      .msg-wrapper {
        max-width: 90%;
      }

      /* Input bar clearance above mobile bottom nav */
      .chat-input-area {
        padding: 10px 12px calc(14px + var(--bottom-nav-h, 54px) + env(safe-area-inset-bottom, 0px));
      }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="erp-layout">
  <!-- SIDEBAR (Vishva ERP Main Navigation) -->
  <aside class="erp-sidebar theme-superadmin" id="sidebar">
    <div class="sidebar-header">
      <a class="sidebar-logo" href="../index.html">
        <div class="sidebar-logo-icon"><img src="../icons/logo.png" alt="Vi"></div>
        <div class="sidebar-logo-text">Vishva <span>ERP</span></div>
      </a>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebar-avatar">U</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebar-user-name">User</div>
        <div class="sidebar-user-role" id="sidebar-user-role">Member</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="javascript:history.back()" class="nav-link"><i class="nav-link-icon fas fa-arrow-left"></i> Go Back</a>
      <a href="messages.html" class="nav-link active"><i class="nav-link-icon fas fa-comments"></i> Messages</a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-logout logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- MAIN VIEWPORT -->
  <div class="erp-main">
    <header class="erp-topbar">
      <div class="topbar-left">
        <button class="topbar-hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
        <div class="topbar-breadcrumb">Platform / <span style="font-weight:800;color:var(--msg-primary)">Messages</span></div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openModal('newMessageModal')">
          <i class="fas fa-edit"></i> <span class="hidden sm:inline">New Chat</span>
        </button>
        <div class="topbar-avatar" id="topbar-avatar">U</div>
      </div>
    </header>

    <!-- CHAT LAYOUT (Master-Detail) -->
    <div class="chat-layout" id="chatLayout">
      <!-- CONTACTS SIDEBAR (MASTER) -->
      <aside class="chat-sidebar" id="chatSidebar">
        <div class="contact-search-wrap">
          <div class="contact-search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search conversations..." id="contactSearch">
          </div>
        </div>
        <div class="contacts-scroll-area">
          <div id="contactsList"></div>
        </div>
      </aside>

      <!-- CHAT THREAD (DETAIL) -->
      <main class="chat-thread" id="chatThread">
        <!-- THREAD HEADER -->
        <div class="chat-thread-header" id="chatHeader">
          <div class="chat-thread-header-main">
            <!-- Mobile Back Button -->
            <button type="button" class="chat-back-btn" id="chatBackBtn" onclick="backToContacts()" title="Back to conversations">
              <i class="fas fa-arrow-left"></i>
            </button>
            <div class="thread-avatar" id="chatAvatar" style="background:linear-gradient(135deg,#4F46E5,#6366F1)">?</div>
            <div style="min-width:0">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-weight:800;font-size:14.5px;color:var(--msg-text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="chatName">Select a conversation</span>
                <span class="badge" id="chatRoleBadge" style="display:none;font-size:10px;padding:2px 7px;background:#EEF2FF;color:#4F46E5;font-weight:800">Role</span>
              </div>
              <div style="font-size:11.5px;color:#10B981;font-weight:700" id="chatStatus">● Online</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="chat-action-btn" onclick="openModal('newMessageModal')" title="Start new conversation">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </div>

        <!-- MESSAGES WINDOW -->
        <div class="chat-messages" id="chatMessages">
          <div class="chat-empty-thread">
            <div class="chat-empty-icon" style="background:linear-gradient(135deg,#4F46E5,#6366F1)">
              <i class="fas fa-comments"></i>
            </div>
            <div class="chat-empty-title">Select a conversation</div>
            <div class="chat-empty-desc">Choose a contact from the list or start a new chat to begin messaging securely.</div>
          </div>
        </div>

        <!-- INPUT BAR -->
        <div class="chat-input-area">
          <button type="button" class="chat-action-btn" title="Attachments" onclick="showToast('Attachment feature coming soon', 'info')">
            <i class="fas fa-paperclip"></i>
          </button>
          <div class="chat-input-wrapper">
            <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()">
          </div>
          <button type="button" class="chat-send-btn" onclick="sendMessage()" title="Send message">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </main>
    </div>
  </div>
</div>

<!-- NEW MESSAGE MODAL -->
<div class="modal-backdrop" id="newMessageModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">New Conversation</div>
      <button class="modal-close" onclick="closeModal('newMessageModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">To (Name or Email)</label>
        <input class="form-control" id="newMsgTo" placeholder="Search user by name or email...">
      </div>
      <div class="form-group">
        <label class="form-label">First Message</label>
        <textarea class="form-control" id="newMsgText" rows="3" placeholder="Write your message..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('newMessageModal')">Cancel</button>
      <button class="btn btn-primary" onclick="startConversation()"><i class="fas fa-paper-plane"></i> Send</button>
    </div>
  </div>
</div>

<script src="../js/shared.js"></script>
<script src="../live/live-pages.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="VishvaERP Icon">
  <defs>
    <linearGradient id="vishvaBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#vishvaBrandGrad)" filter="url(#dropShadow)"/>
  
  <!-- Subtle top sheen highlight -->
  <rect x="36" y="36" width="440" height="220" rx="112" fill="url(#sheen)"/>

  <!-- Centered Bold V Mark -->
  <path d="M138 148 L210 148 L256 308 L302 148 L374 148 L292 364 L220 364 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
</svg>
